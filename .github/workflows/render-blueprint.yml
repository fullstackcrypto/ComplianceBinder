name: Render Blueprint

on:
  pull_request:
    branches: [main]
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml
  push:
    branches: [main]
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml

permissions:
  contents: read

jobs:
  validate-blueprint:
    runs-on: ubuntu-latest
    env:
      RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install check-jsonschema==0.37.4
      - name: Validate against official Render Blueprint schema
        run: check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml
      - name: Install Render CLI for optional workspace validation
        if: ${{ env.RENDER_WORKSPACE_ID != '' && env.RENDER_API_KEY != '' }}
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate against Render workspace
        if: ${{ env.RENDER_WORKSPACE_ID != '' && env.RENDER_API_KEY != '' }}
        run: render blueprints validate render.yaml --workspace "$RENDER_WORKSPACE_ID" -o text
      - name: Explain workspace validation state
        if: ${{ env.RENDER_WORKSPACE_ID == '' || env.RENDER_API_KEY == '' }}
        run: echo "Official schema validation passed; workspace-aware semantic validation will activate when Render CI credentials are configured."
