name: Render Production Probe

on:
  push:
    branches: [ops/render-production-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-render-production:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Confirm Render credentials are configured
        shell: bash
        run: |
          set +x
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_WORKSPACE_ID" ]; then
            echo "::error::RENDER_API_KEY and/or RENDER_WORKSPACE_ID are not configured in GitHub Actions secrets."
            exit 2
          fi
          echo "Render credentials are present; secret values remain masked."

      - name: Authenticate and inventory production resources
        shell: bash
        run: |
          set +x
          request() {
            url="$1"
            out="$2"
            code=$(curl --silent --show-error \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -o "$out" -w '%{http_code}' "$url")
            if [ "$code" != "200" ]; then
              echo "::error::Render API request failed with HTTP $code"
              jq '{message, status, error}' "$out" 2>/dev/null || true
              exit 1
            fi
          }

          request "https://api.render.com/v1/services?ownerId=$RENDER_WORKSPACE_ID&name=ready-set-compliancebinder&limit=100" /tmp/services.json
          request "https://api.render.com/v1/services?ownerId=$RENDER_WORKSPACE_ID&name=ready-set-reminders&limit=100" /tmp/cron.json
          request "https://api.render.com/v1/postgres?ownerId=$RENDER_WORKSPACE_ID&limit=100" /tmp/postgres.json
          request "https://api.render.com/v1/blueprints?ownerId=$RENDER_WORKSPACE_ID&limit=100" /tmp/blueprints.json

          echo "READY_SET_WEB_SERVICE_COUNT=$(jq 'length' /tmp/services.json)"
          jq -c '.[] | (.service // .) | {id, name, type, branch, suspended, url: (.serviceDetails.url // .url // null)}' /tmp/services.json

          echo "READY_SET_CRON_COUNT=$(jq 'length' /tmp/cron.json)"
          jq -c '.[] | (.service // .) | {id, name, type, branch}' /tmp/cron.json

          echo "READY_SET_POSTGRES_COUNT=$(jq '[.[] | (.postgres // .) | select(.name == "ready-set-compliancebinder-db")] | length' /tmp/postgres.json)"
          jq -c '.[] | (.postgres // .) | select(.name == "ready-set-compliancebinder-db") | {id, name, status, plan, region}' /tmp/postgres.json

          echo "BLUEPRINT_COUNT=$(jq 'length' /tmp/blueprints.json)"
          jq -c '.[] | (.blueprint // .) | {id, name, autoSync, path}' /tmp/blueprints.json

      - name: Validate production Blueprint against authenticated workspace
        shell: bash
        run: |
          set +x
          code=$(curl --silent --show-error \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -X POST \
            -F "ownerId=$RENDER_WORKSPACE_ID" \
            -F "file=@render.yaml;type=application/yaml" \
            -o /tmp/blueprint-validation.json \
            -w '%{http_code}' \
            https://api.render.com/v1/blueprints/validate)
          if [ "$code" != "200" ]; then
            echo "::error::Render Blueprint validation API returned HTTP $code"
            jq '{message, status, error, errors}' /tmp/blueprint-validation.json 2>/dev/null || true
            exit 1
          fi
          jq '{valid, errors, hasPlan: ((.plan // .changes // []) | length > 0)}' /tmp/blueprint-validation.json
          jq -e '.valid == true' /tmp/blueprint-validation.json >/dev/null
