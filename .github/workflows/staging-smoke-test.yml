name: Staging smoke test

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Staging app URL, for example https://example.onrender.com'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check public health surface
        run: |
          APP_URL='${{ inputs.app_url }}'
          curl -fsS "$APP_URL/health"
      - name: Confirm detailed monitoring is private
        run: |
          APP_URL='${{ inputs.app_url }}'
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$APP_URL/status")"
          test "$CODE" = "401"
      - name: Confirm production API docs are disabled
        run: |
          APP_URL='${{ inputs.app_url }}'
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$APP_URL/openapi.json")"
          test "$CODE" = "404"
      - name: Check Ready Set pages
        run: |
          APP_URL='${{ inputs.app_url }}'
          curl -fsS "$APP_URL/" | grep -q "Ready Set Solutions"
          curl -fsS "$APP_URL/privacy.html" | grep -q "Ready Set Solutions"
          curl -fsS "$APP_URL/terms.html" | grep -q "Ready Set Solutions"
